    <script>
      (function() {
        function isFirestoreAssert(val) {
          if (!val) return false;
          var str = typeof val === 'string' ? val : (val.message || val.stack || '');
          return str.indexOf('FIRESTORE') !== -1 && (
            str.indexOf('INTERNAL ASSERTION FAILED') !== -1 ||
            str.indexOf('Unexpected state') !== -1 ||
            str.indexOf('ca9') !== -1 ||
            str.indexOf('b815') !== -1 ||
            str.indexOf('WatchChangeAggregator') !== -1
          );
        }
        window.addEventListener('error', function(e) {
          if (isFirestoreAssert(e.error) || isFirestoreAssert(e.message)) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return true;
          }
        }, true);
        window.addEventListener('unhandledrejection', function(e) {
          if (isFirestoreAssert(e.reason)) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
