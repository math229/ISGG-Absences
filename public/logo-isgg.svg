  </g>

  <!-- TEXT BELOW EMBLEM -->
  <text x="350" y="425" class="isgg-black isgg-text" font-size="27" letter-spacing="3.5">
    INSTITUT SUPÉRIEUR DE
  </text>
  <text x="350" y="462" class="isgg-black isgg-text" font-size="29" letter-spacing="2">
    GÉNIE CIVIL ET DE GESTION
  </text>
</svg>
