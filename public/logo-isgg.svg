      <rect x="12" y="5" width="28" height="85" rx="3" class="isgg-orange" />

      <!-- LETTER 'S' (Black) -->
      <path d="M 65 25 C 65 12 75 5 95 5 C 115 5 125 14 125 27 C 125 40 115 45 98 50 C 78 55 65 60 65 72 C 65 85 76 92 96 92 C 118 92 128 82 128 68 L 105 68 C 105 73 102 76 96 76 C 90 76 86 73 86 68 C 86 62 92 59 105 55 C 124 50 145 42 145 25 C 145 10 128 -2 95 -2 C 65 -2 45 10 45 28 L 65 28 Z" class="isgg-black" transform="translate(0, 0)" />

      <!-- LETTER 'G' (Left, Black) -->
      <path d="M 55 105 C 25 105 0 128 0 158 C 0 188 25 210 58 210 C 88 210 110 192 110 162 L 110 150 L 58 150 L 58 168 L 88 168 C 88 180 75 192 56 192 C 38 192 24 178 24 158 C 24 138 38 123 56 123 C 72 123 83 132 86 142 L 108 138 C 102 118 82 105 55 105 Z" class="isgg-black" transform="translate(0, 5)" />

      <!-- LETTER 'G' (Right, Orange) -->
      <path d="M 175 105 C 145 105 120 128 120 158 C 120 188 145 210 178 210 C 208 210 230 192 230 162 L 230 150 L 178 150 L 178 168 L 208 168 C 208 180 195 192 176 192 C 158 192 144 178 144 158 C 144 138 158 123 176 123 C 192 123 203 132 206 142 L 228 138 C 222 118 202 105 175 105 Z" class="isgg-orange" transform="translate(-60, 5)" />
