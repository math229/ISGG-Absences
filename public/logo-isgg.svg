    <path d="M 605 195 C 610 197 612 205 608 210 C 580 245 530 278 460 295 L 455 275 C 515 260 555 230 582 200 C 565 200 540 205 515 215 L 505 200 C 540 190 575 190 605 195 Z" class="isgg-black" />

