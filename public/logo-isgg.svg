<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 480" width="100%" height="100%" fill="none">
  <!-- DEFS -->
  <defs>
    <style>
      .isgg-orange { fill: #EA580C; }
      .isgg-black { fill: #0B0F19; }
      .isgg-text {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 900;
        text-anchor: middle;
      }
    </style>
  </defs>

  <g id="isgg-emblem">
